# Builds and tests every push. A version tag (v1.1.0) also creates a GitHub
# release with the packaged .vsix, after approval in the "release"
# environment. The maintainer uploads that .vsix to the VS Code Marketplace
# (marketplace.visualstudio.com/manage) and Open VSX by hand; no store tokens
# are stored here.
name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run compile
      - run: npm run lint
      - run: xvfb-run -a npm test
      - name: Check that the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
      - run: npx vsce package --out aoe2-control-lua.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: aoe2-control-lua.vsix

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vsix
      - name: Create the GitHub release
        run: |
          version="${GITHUB_REF_NAME#v}"
          cp aoe2-control-lua.vsix "aoe2-control-lua-$version.vsix"
          gh release create "$GITHUB_REF_NAME" "aoe2-control-lua-$version.vsix" \
            --repo "$GITHUB_REPOSITORY" --title "AoE2 CONTROL Lua $version" \
            --notes "See CHANGELOG.md for the changes in this version."
        env:
          GH_TOKEN: ${{ github.token }}
