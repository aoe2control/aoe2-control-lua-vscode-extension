# Builds and tests every push. A version tag (v1.1.0) also publishes the
# extension: the same .vsix goes to the VS Code Marketplace, Open VSX and a
# GitHub release. Publishing waits for approval in the "release" environment.
#
# Repository setup: environment "release" with the maintainer as required
# reviewer, and its secrets VSCE_PAT (Marketplace token for publisher BigJohn)
# and OVSX_PAT (Open VSX token).
name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run compile
      - run: npm run lint
      - run: xvfb-run -a npm test
      - name: Check that the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
      - run: npx vsce package --out aoe2-control-lua.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: aoe2-control-lua.vsix

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vsix
      - name: Publish to the VS Code Marketplace
        run: npx --yes @vscode/vsce publish --packagePath aoe2-control-lua.vsix
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
      - name: Publish to Open VSX
        run: npx --yes ovsx publish aoe2-control-lua.vsix --pat "$OVSX_PAT"
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
      - name: Create the GitHub release
        run: |
          cp aoe2-control-lua.vsix "aoe2-control-lua-${GITHUB_REF_NAME#v}.vsix"
          gh release create "$GITHUB_REF_NAME" "aoe2-control-lua-${GITHUB_REF_NAME#v}.vsix" \
            --repo "$GITHUB_REPOSITORY" --title "AoE2 CONTROL Lua ${GITHUB_REF_NAME#v}" \
            --notes "See CHANGELOG.md for the changes in this version."
        env:
          GH_TOKEN: ${{ github.token }}
